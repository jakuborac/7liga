<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prihlásenie alebo registrácia fanúšika 7. Ligy.">
  <title>Prihlásenie | 7. Liga</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="7. Liga – úvodná stránka">
      <span class="brand-mark" aria-hidden="true"><span>7<span class="brand-letters">LiGA</span></span></span>
    </a>
    <nav class="primary-nav" aria-label="Hlavná navigácia">
      <div class="search-control">
        <button class="icon-button search-toggle" type="button" aria-label="Vyhľadávanie" aria-expanded="false" aria-controls="search-panel">
          <span class="search-icon" aria-hidden="true"></span>
        </button>
        <div class="search-panel" id="search-panel" hidden>
          <label for="site-search">Hľadaj hráča, klub alebo článok</label>
          <input id="site-search" type="search" placeholder="Meno hráča, klubu alebo článku..." autocomplete="off" aria-controls="search-results">
          <p class="search-hint" id="search-hint">Výsledky sa zobrazia počas písania.</p>
          <ul class="search-results" id="search-results" aria-live="polite"></ul>
        </div>
      </div>
      <a class="nav-link" href="hraci.html">HRÁČI</a>
      <a class="nav-link" href="vysledky.html">VÝSLEDKY</a>
      <a class="nav-link" href="clanky.html">ČLÁNKY</a>
    </nav>
    <div class="account-actions">
      <a class="favorite-link" href="oblubene.html" aria-label="Obľúbené kluby a hráči">
        <svg class="favorite-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.4 8.7c0 4.8-7.4 9.7-8.1 10.1a.6.6 0 0 1-.6 0c-.7-.4-8.1-5.3-8.1-10.1a4.4 4.4 0 0 1 8.4-1.8 4.4 4.4 0 0 1 8.4 1.8Z"></path>
        </svg>
      </a>
      <a class="login-button" href="prihlasenie.html" data-auth-link>PRIHLÁSIŤ SA</a>
    </div>
  </header>

  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="auth-heading">
      <h1 class="section-heading" id="auth-heading">PRIHLÁSENIE</h1>
      <div class="auth-mode-switch" role="group" aria-label="Spôsob prístupu">
        <button class="auth-mode-button" type="button" data-auth-mode="login" aria-pressed="true">Prihlásenie</button>
        <button class="auth-mode-button" type="button" data-auth-mode="register" aria-pressed="false">Registrácia</button>
      </div>
      <p class="auth-feedback" id="auth-feedback" role="alert" hidden></p>
      <form class="auth-form" id="login-form">
        <label for="login-identifier">E-mail alebo prezývka</label>
        <input id="login-identifier" name="identifier" type="text" autocomplete="username" required>
        <label for="login-password">Heslo</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button class="auth-submit" type="submit">Prihlásiť sa</button>
      </form>
      <form class="auth-form" id="register-form" hidden>
        <label for="register-nickname">Prezývka</label>
        <input id="register-nickname" name="nickname" type="text" autocomplete="nickname" maxlength="40" required>
        <label for="register-email">E-mail</label>
        <input id="register-email" name="email" type="email" autocomplete="email" required>
        <label for="register-password">Heslo (aspoň 6 znakov)</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="auth-submit" type="submit">Vytvoriť účet</button>
      </form>
      <p class="auth-demo-note">Testovací účet: <strong>fanusik@liga.sk</strong> · heslo <strong>123456</strong></p>
      <p class="auth-security-note">Demo účet je uložený iba v tomto prehliadači. Nepoužívaj skutočné heslo ani citlivé údaje.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">7. LIGA <span aria-label="copyright">©</span></p>
    <button class="footer-contact" type="button" data-demo-link>KONTAKT</button>
  </footer>

  <p class="interaction-message" role="status" aria-live="polite"></p>
</body>
</html>

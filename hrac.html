<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles.css">
  <script src="js/hraci-data.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="7. Liga – úvodná stránka">
      <span class="brand-mark" aria-hidden="true"><span>7<span class="brand-letters">LiGA</span></span></span>
    </a>
    <nav class="primary-nav" aria-label="Hlavná navigácia">
      <div class="search-control">
        <button class="icon-button search-toggle" type="button" aria-label="Vyhľadávanie" aria-expanded="false" aria-controls="search-panel">
          <span class="search-icon" aria-hidden="true"></span>
        </button>
        <div class="search-panel" id="search-panel" hidden>
          <label for="site-search">Hľadaj hráča, klub alebo článok</label>
          <input id="site-search" type="search" placeholder="Meno hráča, klubu alebo článku..." autocomplete="off" aria-controls="search-results">
          <p class="search-hint" id="search-hint">Výsledky sa zobrazia počas písania.</p>
          <ul class="search-results" id="search-results" aria-live="polite"></ul>
        </div>
      </div>
      <a class="nav-link" href="hraci.html" aria-current="page">HRÁČI</a>
      <a class="nav-link" href="vysledky.html">VÝSLEDKY</a>
      <a class="nav-link" href="clanky.html">ČLÁNKY</a>
    </nav>
    <div class="account-actions">
      <a class="favorite-link" href="oblubene.html" aria-label="Obľúbené kluby a hráči">
        <svg class="favorite-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.4 8.7c0 4.8-7.4 9.7-8.1 10.1a.6.6 0 0 1-.6 0c-.7-.4-8.1-5.3-8.1-10.1a4.4 4.4 0 0 1 8.4-1.8 4.4 4.4 0 0 1 8.4 1.8Z"></path>
        </svg>
      </a>
      <a class="login-button" href="prihlasenie.html" data-auth-link>PRIHLÁSIŤ SA</a>
    </div>
  </header>

  <main class="player-profile-layout">
    <article class="player-profile-card" id="player-profile-card">
      <header class="player-profile-header">
        <div class="player-profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="38" r="20"></circle><path d="M24 104c2-26 16-40 36-40s34 14 36 40Z"></path></svg>
        </div>
        <div class="player-profile-title">
          <div class="player-profile-name-row">
            <h1 class="section-heading" id="player-profile-name">Profil hráča</h1>
            <button class="favorite-link player-profile-favorite" type="button" data-add-favorite aria-label="Pridať hráča medzi obľúbené" aria-pressed="false">
              <svg class="favorite-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 8.7c0 4.8-7.4 9.7-8.1 10.1a.6.6 0 0 1-.6 0c-.7-.4-8.1-5.3-8.1-10.1a4.4 4.4 0 0 1 8.4-1.8 4.4 4.4 0 0 1 8.4 1.8Z"></path></svg>
            </button>
          </div>
          <div class="player-profile-meta">
            <strong id="player-profile-number"></strong>
            <span id="player-profile-position"></span>
            <a id="player-profile-club" class="player-profile-club" href="#"><img id="player-profile-club-logo" src="" alt=""><span id="player-profile-club-name"></span></a>
            <span class="player-profile-tag" id="player-profile-age"></span>
            <span class="player-profile-tag" id="player-profile-nationality"></span>
          </div>
        </div>
      </header>
      <section class="player-season-card" aria-labelledby="player-season-heading">
        <h2 class="section-heading" id="player-season-heading">SEZÓNNE ŠTATISTIKY</h2>
        <div class="player-season-grid" id="player-profile-stats"></div>
      </section>
    </article>
    <p class="player-profile-error" id="player-profile-error" role="status" hidden></p>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">7. LIGA <span aria-label="copyright">©</span></p>
    <a class="footer-contact" href="kontakt.html">KONTAKT</a>
  </footer>
  <p class="interaction-message" role="status" aria-live="polite"></p>

</html>
